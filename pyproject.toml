[project]
name = "when-context-sticks"
version = "0.1.0"
description = "Reproducible code for When Context Sticks: Studying Interference in In-Context Learning."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "funcy==1.15",
    "matplotlib==3.5.2",
    "munch==2.5.0",
    "numpy==1.22.3",
    "pandas==1.4.2",
    "protobuf==3.20.1",
    "pyyaml==5.4",
    "quinine==0.3.0",
    "scikit-learn==1.0.2",
    "torch==2.5.1",
    "tqdm==4.64.0",
    "transformers==4.17.0",
    "wandb==0.12.11",
    "xgboost==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.3",
]

[project.scripts]
icl-train = "when_context_sticks.cli:train_main"
icl-eval-ab = "when_context_sticks.cli:eval_ab_main"
icl-paper = "when_context_sticks.cli:paper_main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["when_context_sticks*"]

[tool.uv.extra-build-dependencies]
pyyaml = ["cython<3"]
cytoolz = ["cython<3"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "*.ipynb",
    "src/eval.py",
    "src/models.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
